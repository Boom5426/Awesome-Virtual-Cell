<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual Cell Research Landscape</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f8fa;color:#172033;overflow:hidden}.shell{height:100vh;display:grid;grid-template-rows:auto 1fr}header{background:#fff;border-bottom:1px solid #dce5ea;padding:14px 18px;display:flex;justify-content:space-between;gap:14px;align-items:center}h1{font-size:20px;margin:0}header p{margin:3px 0 0;color:#667085;font-size:12px}a{color:#0b6e99}.stage{position:relative}.toolbar{position:absolute;right:14px;top:14px;z-index:2;display:flex;gap:6px}.toolbar button{background:#fff;border:1px solid #dce5ea;border-radius:9px;padding:8px 11px;cursor:pointer}.hint{position:absolute;left:14px;bottom:14px;background:#ffffffdd;border:1px solid #dce5ea;border-radius:9px;padding:8px 10px;color:#667085;font-size:12px;z-index:2}svg{width:100%;height:100%;display:block;touch-action:none}.edge{fill:none;stroke:#afc1ca;stroke-width:2}.node rect{fill:#fff;stroke:#cbd9df;stroke-width:1.5}.node.branch rect{fill:#eef8fa;stroke:#90c8d3}.node.root rect{fill:#0b6e99;stroke:#0b6e99}.node.root text{fill:#fff}.node{cursor:pointer}.label{font-size:14px;font-weight:700}.count{font-size:11px;fill:#70808d}.node.root .count{fill:#fff}</style></head><body><div class="shell">
<header><div><h1>🗺️ Virtual Cell Research Landscape</h1><p>Interactive mind map · counts overlap across branches</p></div><div><a href="./">Search catalog</a> · <a href="https://github.com/Boom5426/Awesome-Virtual-Cell#research-papers">Full list</a></div></header>
<div class="stage"><div class="toolbar"><button id="out">−</button><button id="in">+</button><button id="fit">Fit</button></div><div class="hint">Scroll to zoom · drag to pan · click branch to collapse · click leaf to filter</div><svg id="map" viewBox="0 0 1600 900"><g id="scene"></g></svg></div></div>
<script>const PAPERS=__LANDSCAPE_DATA__,MAP=__LANDSCAPE_CONFIG__,svg=document.getElementById("map"),scene=document.getElementById("scene"),NS="http://www.w3.org/2000/svg",collapsed=new Set();let tr={x:800,y:450,s:1},drag=null;
function E(n,a){const x=document.createElementNS(NS,n);for(const k in(a||{}))x.setAttribute(k,a[k]);return x}function rows(tag){return PAPERS.filter(p=>(p.tags||[]).includes(tag))}function edge(a,b,c,d){scene.appendChild(E("path",{class:"edge",d:"M "+a+" "+b+" C "+((a+c)/2)+" "+b+", "+((a+c)/2)+" "+d+", "+c+" "+d}))}
function node(x,y,w,h,label,n,kind,tag,bi){const g=E("g",{class:"node "+kind,transform:"translate("+(x-w/2)+","+(y-h/2)+")"});g.appendChild(E("rect",{width:w,height:h,rx:11}));let t=E("text",{class:"label",x:13,y:h/2-2});t.textContent=label;g.appendChild(t);t=E("text",{class:"count",x:13,y:h/2+15});t.textContent=n+" papers";g.appendChild(t);const title=E("title");title.textContent=(tag?rows(tag):PAPERS).slice(0,5).map(p=>(p.label||p.title)+" ("+p.year+")").join("\n");g.appendChild(title);g.onclick=()=>{if(kind==="leaf")location.href="./?tag="+encodeURIComponent(tag);else if(kind==="root")location.href="./";else{collapsed.has(bi)?collapsed.delete(bi):collapsed.add(bi);render()}};scene.appendChild(g)}
function apply(){scene.setAttribute("transform","translate("+tr.x+" "+tr.y+") scale("+tr.s+")")}function render(){scene.replaceChildren();const L=MAP.branches.map((b,i)=>({b,i})).filter(x=>x.b.side==="left"),R=MAP.branches.map((b,i)=>({b,i})).filter(x=>x.b.side==="right"),pos=new Map();for(const q of[L,R])q.forEach((x,j)=>pos.set(x.i,(j-(q.length-1)/2)*260));for(const x of MAP.branches.map((b,i)=>({b,i}))){const b=x.b,i=x.i,s=b.side==="left"?-1:1,y=pos.get(i),bx=s*370;edge(s*120,0,bx-s*110,y);if(!collapsed.has(i))b.children.forEach((c,j)=>edge(bx+s*110,y,s*635,y+(j-(b.children.length-1)/2)*70))}node(0,0,250,70,"Virtual Cell",PAPERS.length,"root",null,null);for(const x of MAP.branches.map((b,i)=>({b,i}))){const b=x.b,i=x.i,s=b.side==="left"?-1:1,y=pos.get(i),ids=new Set(b.children.flatMap(c=>rows(c.tag).map(p=>p.id)));node(s*370,y,220,54,b.name,ids.size,"branch",null,i);if(!collapsed.has(i))b.children.forEach((c,j)=>node(s*750,y+(j-(b.children.length-1)/2)*70,230,46,c.name,rows(c.tag).length,"leaf",c.tag,i))}apply()}
function zoom(f,x=800,y=450){const ns=Math.max(.35,Math.min(2.8,tr.s*f)),wx=(x-tr.x)/tr.s,wy=(y-tr.y)/tr.s;tr={s:ns,x:x-wx*ns,y:y-wy*ns};apply()}function fit(){const b=scene.getBBox(),s=Math.min(1420/b.width,760/b.height,1.3);tr={s,x:800-(b.x+b.width/2)*s,y:450-(b.y+b.height/2)*s};apply()}
document.getElementById("in").onclick=()=>zoom(1.2);document.getElementById("out").onclick=()=>zoom(1/1.2);document.getElementById("fit").onclick=fit;svg.onwheel=e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(e.deltaY<0?1.12:1/1.12,(e.clientX-r.left)/r.width*1600,(e.clientY-r.top)/r.height*900)};svg.onpointerdown=e=>{if(e.target.closest(".node"))return;drag={x:e.clientX,y:e.clientY,tx:tr.x,ty:tr.y};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!drag)return;const r=svg.getBoundingClientRect();tr.x=drag.tx+(e.clientX-drag.x)/r.width*1600;tr.y=drag.ty+(e.clientY-drag.y)/r.height*900;apply()};svg.onpointerup=()=>drag=null;render();requestAnimationFrame(fit);</script></body></html>
