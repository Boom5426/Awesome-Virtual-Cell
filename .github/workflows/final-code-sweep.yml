name: Final code-link sweep
on:
  push:
    branches: [audit/final-code-sweep-2026-09-28]
    paths:
      - audit_tools/final_code_sweep.py
      - .github/workflows/final-code-sweep.yml
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Search unresolved method and benchmark records
        env:
          GH_TOKEN: ${{ github.token }}
        run: python audit_tools/final_code_sweep.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-code-sweep
          path: audit_output/
          retention-days: 7
