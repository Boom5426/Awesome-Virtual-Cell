name: Auto Update Awesome Virtual Cell

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Discover and update structured catalog
        run: python scripts/auto_update_catalog.py

      - name: Regenerate and validate views
        run: |
          python scripts/build_landscape.py
          python scripts/validate_catalog.py
          python scripts/build_readme.py --check
          python scripts/build_exports.py
          cp docs/catalog.html /tmp/catalog.before.html
          python scripts/build_catalog.py
          diff -u /tmp/catalog.before.html docs/catalog.html

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/update-awesome-${{ github.run_id }}
          delete-branch: true
          add-paths: |
            data/papers.json
            README.md
            docs/catalog.html
            docs/index.html
            index.html
            landscape.html
            docs/landscape.html
            exports/papers.csv
            exports/papers.bib
            auto_update_summary.md
          commit-message: "docs: update structured virtual cell catalog"
          title: "docs: structured virtual cell literature update"
          body-path: auto_update_summary.md
          draft: true
          labels: |
            automated
            literature-update
