name: Watch Preprint Publications

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  publication-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check preprints for formal publications
        run: python scripts/publication_watcher.py --apply --max-updates 10

      - name: Rebuild generated views
        run: |
          python scripts/build_readme.py
          python scripts/build_catalog.py
          python scripts/build_landscape.py
          python scripts/build_exports.py
          python scripts/validate_catalog.py
          python scripts/build_readme.py --check

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/papers.json README.md docs/catalog.html docs/index.html index.html landscape.html docs/landscape.html exports; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/publication-watch-${{ github.run_id }}
          delete-branch: true
          add-paths: |
            data/papers.json
            README.md
            docs/catalog.html
            docs/index.html
            index.html
            landscape.html
            docs/landscape.html
            exports/papers.csv
            exports/papers.bib
            publication_update_summary.md
          commit-message: "docs: upgrade preprints to formal publications"
          title: "docs: publication upgrades"
          body-path: publication_update_summary.md
          draft: true
          labels: |
            automated
            publication-update
