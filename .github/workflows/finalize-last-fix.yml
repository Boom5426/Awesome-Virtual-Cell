name: Finalize code-link sweep
on:
  push:
    branches: [audit/final-code-sweep-2026-09-28]
    paths:
      - audit_tools/finalize_last_fix.py
      - .github/workflows/finalize-last-fix.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python audit_tools/finalize_last_fix.py
      - run: |
          python scripts/build_readme.py
          python scripts/build_catalog.py
          python scripts/build_landscape.py
          python scripts/build_exports.py
          python scripts/validate_catalog.py
          python scripts/build_readme.py --check
          python -m unittest discover -s tests
          node tests/test_catalog_ui.cjs
      - run: |
          git config user.name "Bo li"
          git config user.email "83391363+Boom5426@users.noreply.github.com"
          git rm audit_tools/finalize_last_fix.py .github/workflows/finalize-last-fix.yml
          git add data/papers.json README.md index.html landscape.html docs/catalog.html docs/index.html docs/landscape.html docs/final-code-sweep-2026-09-28.md exports/papers.csv exports/papers.bib tests/test_code_metadata.py
          git commit -m "curation: add final verified code link"
          git push origin HEAD:audit/final-code-sweep-2026-09-28
