# Catalog integrity checks
name: Validate Catalog

on:
  push:
    paths:
      - "README.md"
      - "data/**"
      - "config/**"
      - "scripts/build_readme.py"
      - "scripts/build_catalog.py"
      - "scripts/build_landscape.py"
      - "scripts/build_exports.py"
      - "scripts/validate_catalog.py"
      - "scripts/auto_update_catalog.py"
      - "scripts/publication_watcher.py"
      - "exports/**"
      - "docs/catalog.template.html"
      - "docs/landscape.template.html"
      - "docs/catalog.html"
      - "docs/index.html"
      - "docs/landscape.html"
      - "index.html"
      - "landscape.html"
      - "tests/**"
      - ".github/workflows/catalog-ci.yml"
  pull_request:
    paths:
      - "README.md"
      - "data/**"
      - "config/**"
      - "scripts/build_readme.py"
      - "scripts/build_catalog.py"
      - "scripts/build_landscape.py"
      - "scripts/build_exports.py"
      - "scripts/validate_catalog.py"
      - "scripts/auto_update_catalog.py"
      - "scripts/publication_watcher.py"
      - "exports/**"
      - "docs/catalog.template.html"
      - "docs/landscape.template.html"
      - "docs/catalog.html"
      - "docs/index.html"
      - "docs/landscape.html"
      - "index.html"
      - "landscape.html"
      - "tests/**"
      - ".github/workflows/catalog-ci.yml"

concurrency:
  group: catalog-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate structured catalog
        run: python scripts/validate_catalog.py
      - name: Check README synchronization
        run: python scripts/build_readme.py --check
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Test catalog search and exports
        run: node tests/test_catalog_ui.cjs
      - name: Check generated exports
        run: |
          cp exports/papers.csv /tmp/papers.before.csv
          cp exports/papers.bib /tmp/papers.before.bib
          python scripts/build_exports.py
          diff -u /tmp/papers.before.csv exports/papers.csv
          diff -u /tmp/papers.before.bib exports/papers.bib
      - name: Check generated Research Landscape
        run: |
          cp landscape.html /tmp/landscape.before.html
          cp docs/landscape.html /tmp/docs-landscape.before.html
          python scripts/build_landscape.py
          diff -u /tmp/landscape.before.html landscape.html
          diff -u /tmp/docs-landscape.before.html docs/landscape.html
      - name: Check generated searchable catalog
        run: |
          cp docs/catalog.html /tmp/catalog.before.html
          cp docs/index.html /tmp/docs-index.before.html
          cp index.html /tmp/root-index.before.html
          python scripts/build_catalog.py
          diff -u /tmp/catalog.before.html docs/catalog.html
          diff -u /tmp/docs-index.before.html docs/index.html
          diff -u /tmp/root-index.before.html index.html
