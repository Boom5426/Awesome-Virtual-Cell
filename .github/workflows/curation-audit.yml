name: Collect Curation Evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/collect_curation_evidence.py
      - .github/workflows/curation-audit.yml
permissions:
  contents: read
concurrency:
  group: curation-evidence
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read primary sources and repository metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/collect_curation_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curation-evidence
          path: curation-evidence/
          retention-days: 7
