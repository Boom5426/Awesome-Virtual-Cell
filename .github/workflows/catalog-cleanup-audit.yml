name: Catalog cleanup publish
on:
  push:
    branches: [audit/catalog-cleanup-2026-09-28]
    paths:
      - .github/workflows/catalog-cleanup-audit.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply reviewed cleanup
        run: python audit_tools/apply_catalog_cleanup.py
      - name: Rebuild and validate
        run: |
          python scripts/build_readme.py
          python scripts/build_catalog.py
          python scripts/build_landscape.py
          python scripts/build_exports.py
          python scripts/validate_catalog.py
          python scripts/build_readme.py --check
          python -m unittest discover -s tests
          node tests/test_catalog_ui.cjs
      - name: Commit only durable catalog changes
        run: |
          git config user.name "Bo li"
          git config user.email "83391363+Boom5426@users.noreply.github.com"
          git rm audit_tools/apply_catalog_cleanup.py .github/workflows/catalog-cleanup-audit.yml
          git add data/papers.json README.md index.html landscape.html docs/architecture.md docs/catalog.html docs/index.html docs/landscape.html docs/code-audit-2026-09-28.md docs/catalog-cleanup-2026-09-28.md exports/papers.csv exports/papers.bib tests/test_curation.py
          git commit -m "curation: apply verified catalog cleanup"
          git push origin HEAD:audit/catalog-cleanup-2026-09-28
