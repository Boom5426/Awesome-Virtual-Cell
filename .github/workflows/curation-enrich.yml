name: Enrich Curation Evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/curation-enrich.yml]
permissions:
  contents: read
  actions: read
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: curation-evidence
          path: curation-evidence
          run-id: 36176355822
          github-token: ${{ github.token }}
      - name: Resolve remaining source and repository evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/enrich_curation_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: curation-evidence-enriched
          path: curation-evidence/evidence-enriched.json
          retention-days: 7
